---
# K8s ServiceAccount для CI/CD
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-cd-sa
  namespace: kube-system

---
# ClusterRole: чтение нод (для kubectl get nodes)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ci-cd-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding: привязка к K8s-SA
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ci-cd-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ci-cd-reader
subjects:
  - kind: ServiceAccount
    name: ci-cd-sa
    namespace: kube-system

---
# Role в namespace diploma
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-cd-deployer
  namespace: diploma
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding в namespace diploma
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-cd-deployer-binding
  namespace: diploma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-cd-deployer
subjects:
  - kind: ServiceAccount
    name: ci-cd-sa
    namespace: kube-system
